allowBuilds:
  esbuild: true # bundler needs its platform binary

# Supply-chain guard: only install package versions published more than 5 days ago.
# Unit is MINUTES (7200 = 5 days). pnpm 11 defaults this ON at 1440 (1 day).
minimumReleaseAge: 7200

# foundry-types pins handlebars 4.7.9 exactly; 4.7.10 clears GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f, GHSA-xw65-4hp5-5hc7.
overrides:
  handlebars: 4.7.10
